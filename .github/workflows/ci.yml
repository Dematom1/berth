name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  main-required-ci:
    name: main-required-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6
        with:
          distribution: goreleaser
          version: latest
          args: check
      - name: Format, vet, test, and build
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build -o "$RUNNER_TEMP/dibs" .
          GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/dibs-linux" .
          GOOS=darwin GOARCH=arm64 go build -o "$RUNNER_TEMP/dibs-darwin" .
      - name: Verify demo leases, heartbeat, jobs, and FIFO
        run: .claude/skills/verify/verify.py local --evidence "$RUNNER_TEMP/verify/local"
      - name: Verify real SSH machine workflow
        run: .claude/skills/verify/verify.py ssh --evidence "$RUNNER_TEMP/verify/ssh"
      - name: Install kind and k3d for real adapter integration
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind-linux-amd64"
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  '"$RUNNER_TEMP/kind-linux-amd64" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/kind-linux-amd64" /usr/local/bin/kind
          curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64 -o "$RUNNER_TEMP/k3d-linux-amd64"
          echo 'dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  '"$RUNNER_TEMP/k3d-linux-amd64" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/k3d-linux-amd64" /usr/local/bin/k3d
          kind --version
          k3d version
          docker info
          docker compose version
      - name: Verify demo Compose HTTP and Ready kind/k3d nodes
        run: .claude/skills/verify/verify.py adapters --evidence "$RUNNER_TEMP/verify/adapters"
      - name: Real kind, k3d, and Compose adapter integration
        run: make integration
      - name: Retain verification evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dibs-verification
          path: ${{ runner.temp }}/verify
          if-no-files-found: warn
          retention-days: 7
