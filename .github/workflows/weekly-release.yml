name: Weekly release merge

on:
  schedule:
    - cron: "7 8 * * 1" # Monday 08:07 UTC; avoid the top-of-hour scheduling peak.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect eligibility without merging
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  release:
    uses: Dematom1/oss-workflows/.github/workflows/merge-release.yml@ee220d669cbb1376363825c273291dea4a539847
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
