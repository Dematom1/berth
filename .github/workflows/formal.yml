name: Bounded formal verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formal:
    name: Bounded models and known counterexamples
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Check models, real-code bindings, and broken variants
        env:
          FORMAL_LOG_DIR: ${{ runner.temp }}/berth-formal
        # ubuntu-24.04 includes Java 21. No Docker, SSH server, or paid service.
        run: |
          export JAVA="$JAVA_HOME_21_X64/bin/java"
          "$JAVA" -version
          just formal
      - name: Save model-checker traces, including known failing properties
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-counterexamples
          path: |
            ${{ runner.temp }}/berth-formal/*.log
            ${{ runner.temp }}/berth-formal/*.cfg
            ${{ runner.temp }}/berth-formal/*.tla
          if-no-files-found: warn
          retention-days: 14
