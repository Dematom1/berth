name: Bug report
description: Report a bug. Bug reports are welcome without asking first.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste secrets, SSH keys, kubeconfigs, environment credentials, or unredacted production output. Redact private hostnames and identifiers.
        Report security problems privately as described in [SECURITY.md](https://github.com/Dematom1/berth/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: The exact version you ran, from `berth --version`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Go version if built locally, and versions of Docker, kind, k3d, Compose, or SSH where relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact commands that show the bug. Use disposable resources, not production containers or services.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized output
      description: Relevant output with secrets and private identifiers removed.
      render: shell
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What a fix changes and leaves alone. Say if you want to fix it yourself. Substantial fixes need the ready-for-pr label first.
  - type: dropdown
    id: contract
    attributes:
      label: Contract effect
      description: See "Classify the contract effect" in CONTRIBUTING.md.
      options:
        - restore - returns behavior that regressed
        - opt-in - adds behavior without changing defaults
        - new-default - changes default behavior or the existing contract
        - cannot-tell
    validations:
      required: true
