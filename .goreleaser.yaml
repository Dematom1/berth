version: 2
project_name: dibs

builds:
  - id: dibs
    main: .
    binary: dibs
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
  # Deprecated berth command: the same program, warning on stderr when invoked as berth.
  - id: berth
    main: .
    binary: berth
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

release:
  github:
    owner: Dematom1
    name: dibs
